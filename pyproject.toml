[project]
name = "ipynb-pdf"
version = "0.1.5"
description = "Intelligent IPYNB to HTML/PDF exporter with cell-level preprocessing."
authors = [{ name = "KpihX", email = "kapoivha@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "weasyprint>=58.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
ipynb-pdf = "ipynb_pdf.cli:main"

[tool.setuptools.package-data]
ipynb_pdf = ["css/*.css", "templates/*.html", "*.yaml"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"